name: build

# Build the one-file Linux bundles (x86_64 + ARM64) and the Flatpak
# bundle on tags and attach them to a release. The Flatpak references
# the freedesktop runtime instead of bundling it, so the artifact
# stays small.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  flatpak:
    runs-on: ubuntu-latest
    # The flathub-infra image ships flatpak tooling and runs root, so
    # runtime deploys to the system installation work (the bare runner
    # user gets denied by polkit). --privileged for the sandbox helpers.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: io.github.ajgonzalez.PodRacer.yml
          bundle: podracer.flatpak
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          branch: stable
          cache: true
          upload-artifact: false
      - name: Install and smoke inside the sandbox
        run: |
          flatpak remote-add --if-not-exists --no-gpg-verify podracer-repo repo
          flatpak install --noninteractive podracer-repo io.github.ajgonzalez.PodRacer
          flatpak run --command=sh io.github.ajgonzalez.PodRacer -c \
            'command -v ffmpeg && command -v ffprobe && echo ffmpeg-ok'
          QT_QPA_PLATFORM=offscreen flatpak run io.github.ajgonzalez.PodRacer --smoke
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: podracer-flatpak
          path: podracer.flatpak

  build-linux:
    runs-on: ${{ matrix.runs-on }}
    needs: flatpak
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            binary: podracer
          - runs-on: ubuntu-24.04-arm
            binary: podracer-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System dependencies
        run: |
          sudo apt-get update
          # ffmpeg: tag reading + transcode (also needed by the tests and
          # the smoke check). The rest are Qt offscreen/headless runtime
          # libraries. The device layer talks to udisks2 over D-Bus now,
          # but the package is still installed for the daemon tests.
          sudo apt-get install -y ffmpeg udisks2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Python dependencies
        run: pip install pyinstaller PySide6

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -t . -v

      - name: Build onefile bundle
        run: bash scripts/build_onefile.sh ${{ matrix.binary }}

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./${{ matrix.binary }} --smoke

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    runs-on: ubuntu-latest
    # One release for all three artifacts; a per-matrix-cell Release
    # step would race. Dispatch runs are verification-only.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [flatpak, build-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: podracer
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: podracer-arm64
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: podracer-flatpak
          path: .
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            podracer
            podracer-arm64
            podracer.flatpak
          name: PodRacer ${{ github.ref_name }}
