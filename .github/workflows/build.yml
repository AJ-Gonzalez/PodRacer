name: build

# Build the one-file Linux bundle on tags and attach it to a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # The Release step creates a GitHub Release; the default token is
    # read-only, so the job must request write access to contents.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: System dependencies
        run: |
          sudo apt-get update
          # ffmpeg: tag reading + transcode (also needed by the tests and
          # the smoke check). udisksctl: the startup guard checks for it.
          # The rest are Qt offscreen/headless runtime libraries.
          sudo apt-get install -y ffmpeg udisks2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Python dependencies
        run: pip install pyinstaller PySide6

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 -m unittest discover -s tests -t . -v

      - name: Build onefile bundle
        run: bash scripts/build_onefile.sh

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./podracer --smoke

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: podracer
          name: PodRacer ${{ github.ref_name }}
