name: publish-app

# Ship the podracer_mapple app dist to PyPI. Separate workflow from the
# codec's (publish-db.yml) on purpose: PyPI trusted-publishing matching
# keys on repo + workflow filename, so two projects sharing one
# workflow make the publisher match ambiguous. One workflow per
# project = deterministic. Publish the codec first (the app declares
# podracer_db as a dependency).
#
# Trusted publishing (OIDC): register a pending publisher on
# test.pypi.org AND pypi.org for project podracer_mapple — Owner
# AJ-Gonzalez, Repository PodRacer, Workflow name publish-app.yml,
# Environment left empty.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to (tag pushes always do both)"
        type: choice
        default: testpypi
        options: [testpypi, pypi, both]

permissions:
  contents: read
  id-token: write

jobs:
  publish-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg udisks2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install PySide6
          python3 -m unittest discover -s tests -t . -v
      - name: Tag matches version (v tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PYPROJECT="$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          INIT="$(python3 -c \
            "import ast; t=ast.parse(open('src/podracer/__init__.py').read()); \
             print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) \
             and any(getattr(x,'id','')=='__version__' for x in n.targets)))")"
          [ "$TAG" = "$PYPROJECT" ] || { echo "tag v$TAG != pyproject $PYPROJECT"; exit 1; }
          [ "$PYPROJECT" = "$INIT" ] || { echo "pyproject $PYPROJECT != __version__ $INIT"; exit 1; }
      - name: Build sdist + wheel
        run: |
          pip install build
          python3 -m build
      - name: Wheel smoke (fresh venv, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet PySide6 packages/podracer_db
          /tmp/smoke/bin/pip install --quiet dist/podracer_mapple-*.whl
          /tmp/smoke/bin/podracer --smoke
      - name: Publish to Test PyPI
        if: startsWith(github.ref, 'refs/tags/') || inputs.target == 'testpypi' || inputs.target == 'both'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          # Test PyPI is disposable: re-runs re-upload the same version
          # (e.g. after a CI fix). Skip instead of failing. PyPI stays
          # strict — a duplicate there means a bad bump.
          skip-existing: true
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') || inputs.target == 'pypi' || inputs.target == 'both'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
