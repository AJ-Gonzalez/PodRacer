name: publish

# Ship the PyPI dists. Two packages, two tag families (independent
# versions): the app releases on v* (same tag the onefile binary
# release in build.yml rides), the codec on db-v*.
#
# Trusted publishing (OIDC): no API tokens in the repo. Register a
# pending publisher on test.pypi.org AND pypi.org for EACH project
# (podracer_db, podracer_mapple) — Owner AJ-Gonzalez, Repository
# PodRacer, Workflow publish.yml, Environment left empty.
on:
  push:
    tags: ["v*", "db-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to (tag pushes always do both)"
        type: choice
        default: testpypi
        options: [testpypi, pypi, both]

permissions:
  contents: read
  id-token: write

jobs:
  publish-db:
    # Codec: db-v* tags, or any manual dispatch.
    if: startsWith(github.ref, 'refs/tags/db-v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Quality gates (codec tests)
        run: python3 -m unittest tests.test_itunesdb tests.test_fixtures -v
      - name: Tag matches version (db-v tags only)
        if: startsWith(github.ref, 'refs/tags/db-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/db-v}"
          PYPROJECT="$(python3 -c \
            "import tomllib; print(tomllib.load(open('packages/podracer_db/pyproject.toml','rb'))['project']['version'])")"
          INIT="$(python3 -c \
            "import ast; t=ast.parse(open('packages/podracer_db/src/podracer_db/__init__.py').read()); \
             print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) \
             and any(getattr(x,'id','')=='__version__' for x in n.targets)))")"
          [ "$TAG" = "$PYPROJECT" ] || { echo "tag db-v$TAG != pyproject $PYPROJECT"; exit 1; }
          [ "$PYPROJECT" = "$INIT" ] || { echo "pyproject $PYPROJECT != __version__ $INIT"; exit 1; }
      - name: Build sdist + wheel
        working-directory: packages/podracer_db
        run: |
          pip install build
          python3 -m build
      - name: Wheel smoke (fresh venv round-trip)
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet packages/podracer_db/dist/podracer_db-*.whl
          /tmp/smoke/bin/python - <<'EOF'
          from podracer_db import __version__, parse_db, write_db
          from podracer_db.model import Library, Playlist, Track
          t = Track(title="T", ipod_path=":iPod_Control:Music:F00:AB12.mp3")
          lib = Library(tracks=[t])
          lib.playlists = [Playlist(name="P", ptype=1, id=1, members=[t])]
          assert parse_db(write_db(lib, firewire_guid="0011223344556677")) \
              .master_playlist().members[0].title == "T"
          print("codec wheel OK", __version__)
          EOF
      - name: Publish to Test PyPI
        if: startsWith(github.ref, 'refs/tags/') || inputs.target == 'testpypi' || inputs.target == 'both'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/podracer_db/dist
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') || inputs.target == 'pypi' || inputs.target == 'both'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/podracer_db/dist

  publish-app:
    # App: v* tags (never db-v), or any manual dispatch. Runs only when
    # the codec publish succeeded or was skipped (app-only release) —
    # the app's dist declares podracer_db, so it must not ship on a
    # broken codec release.
    needs: publish-db
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && needs.publish-db.result != 'failure' && needs.publish-db.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg udisks2 \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install PySide6
          python3 -m unittest discover -s tests -t . -v
      - name: Tag matches version (v tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PYPROJECT="$(python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          INIT="$(python3 -c \
            "import ast; t=ast.parse(open('src/podracer/__init__.py').read()); \
             print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) \
             and any(getattr(x,'id','')=='__version__' for x in n.targets)))")"
          [ "$TAG" = "$PYPROJECT" ] || { echo "tag v$TAG != pyproject $PYPROJECT"; exit 1; }
          [ "$PYPROJECT" = "$INIT" ] || { echo "pyproject $PYPROJECT != __version__ $INIT"; exit 1; }
      - name: Build sdist + wheel
        run: |
          pip install build
          python3 -m build
      - name: Wheel smoke (fresh venv, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet PySide6 packages/podracer_db
          /tmp/smoke/bin/pip install --quiet dist/podracer_mapple-*.whl
          /tmp/smoke/bin/podracer --smoke
      - name: Publish to Test PyPI
        if: startsWith(github.ref, 'refs/tags/') || inputs.target == 'testpypi' || inputs.target == 'both'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') || inputs.target == 'pypi' || inputs.target == 'both'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
