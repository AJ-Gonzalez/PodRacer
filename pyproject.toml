[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# App dist name. 'podracer' itself is taken on PyPI by an unrelated
# podcast library; the codec publishes separately as 'podracer_db'
# (own pyproject under packages/podracer_db). Imports stay 'podracer'.
name = "podracer_mapple"
version = "1.1.1"
description = "Transfer music to an iPod from Linux, no iTunes"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "podracer_db>=1.0.0",
]
license-files = ["LICENSE"]
readme = "README.md"

[project.scripts]
podracer = "podracer.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["podracer"]

# The wheel must carry the bundled fonts/icons or a pip-installed app
# silently runs without them (onefile bundles via --add-data instead).
[tool.setuptools.package-data]
podracer = ["fonts/*.ttf", "fonts/LICENSE-*.txt", "assets/*.png", "assets/icons/*"]
