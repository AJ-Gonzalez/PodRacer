[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# App dist name. 'podracer' itself is taken by an unrelated podcast
# library; the codec publishes separately as 'podracer_db' (own config
# lands with the packaging work). Imports stay 'podracer'.
name = "podracer_mapple"
version = "0.1.0"
description = "Transfer music to an iPod from Linux, no iTunes"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
]

[project.license-files]
files = ["LICENSE"]

[project.scripts]
podracer = "podracer.main:main"

[tool.setuptools.packages.find]
include = ["podracer*", "podracer_db*"]
